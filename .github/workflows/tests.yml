name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # Cellpose downloads its model weights on first use. Cache them so the
      # matrix does not re-download ~100 MB per job on every run.
      - name: Cache Cellpose models
        uses: actions/cache@v4
        with:
          path: ~/.cellpose
          key: cellpose-models-${{ runner.os }}-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Report resolved environment
        run: |
          python -c "import numpy, skimage, cellpose; print('numpy', numpy.__version__); print('skimage', skimage.__version__); print('cellpose', cellpose.version)"

      - name: Check the CLI loads
        run: python cellquant.py --help

      - name: Run tests
        run: pytest -q
